name: OpenAPI REST preflight example
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: openapi-preflight-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the candidate without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Fetch and verify the reviewed public CLI
        run: bash scripts/fetch-cli.sh
      - name: Replay positive and negative synthetic examples
        run: node scripts/replay.mjs
      - name: Check candidate and compare PR base
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ -n "$BASE_SHA" ]]; then
            [[ "$BASE_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 2
            base_file="${RUNNER_TEMP}/openapi-base.json"
            git show "${BASE_SHA}:api/openapi.json" > "$base_file"
            node scripts/preflight.mjs api/openapi.json "$base_file"
          else
            node scripts/preflight.mjs api/openapi.json
          fi
